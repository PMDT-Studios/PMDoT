name: GCHAT

on:
  pull_request:
    types: [opened, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar Aviso PR Para Google Chat
        env:
          URL_GOOGLE_CHAT: ${{ secrets.GOOGLE_CHAT_URL }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MSG: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          URL=$(printf '%s' "$URL_GOOGLE_CHAT" | tr -d '[:space:]"')

          if [ "$IS_DRAFT" = "true" ]; then
            STATUS="O PR está em DRAFT"
          else
            STATUS="O PR está pronto para revisão"
          fi

          TEXT=$(printf 'Organização onde o PR foi aberto: *%s*\n\nRepositório: *%s*\n\nBranch: *%s*\n\nTítulo do PR: *%s*\n\nAutor: *%s*\n\n%s\n\nLink para o PR: %s' \
            "$ORG" "$REPO" "$BRANCH" "$MSG" "$ACTOR" "$STATUS" "$PR_URL")
          
          jq -n --arg text "$TEXT" '{text: $text}' \
          | curl -fsS -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d @-
