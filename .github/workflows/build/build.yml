name: Build PMDOT

on:
  pull_request: 
    types: [opened]

jobs:
  run-build:
    runs-on: ubuntu-latest

    steps:
      - name: Updating the system
        run: |
          sudo apt-get update
      - name: Installing dependencies
        #Everything from godot doc
        run: |
          sudo apt-get install -y \
          build-essential \
          g++-11 \
          scons \
          pkg-config \
          libx11-dev \
          libxcursor-dev \
          libxinerama-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libudev-dev \
          libxi-dev \
          libxrandr-dev \
          libwayland-dev
      - name: Build PMDoT
        run: python3 pmdot.py build
        
          
