name: Build PMDOT

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  run-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Updating the system
        run: |
          sudo apt-get update

      - name: Installing dependencies
        # Everything from godot doc
        run: |
          sudo apt-get install -y \
          build-essential \
          scons \
          pkg-config \
          libx11-dev \
          libxcursor-dev \
          libxinerama-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libudev-dev \
          libxi-dev \
          libxrandr-dev \
          libwayland-dev \
          libwayland-bin \
          libxkbcommon-dev \
          libdbus-1-dev \
          libfontconfig1-dev

      - name: Build PMDoT
        run: python3 pmdot.py build

  notify:
    needs: run-build
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest

    steps:
      - name: Enviar Aviso PR Para Google Chat
        env:
          URL_GOOGLE_CHAT: ${{ secrets.GOOGLE_CHAT_URL }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MSG: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          URL=$(printf '%s' "$URL_GOOGLE_CHAT" | tr -d '[:space:]"')

          TEXT=$(printf 'Organização onde o PR foi aberto: *%s*\n\nRepositório: *%s*\n\nBranch: *%s*\n\nTítulo do PR: *%s*\n\nAutor: *%s*' \
            "$ORG" "$REPO" "$BRANCH" "$MSG" "$ACTOR")

          jq -n --arg text "$TEXT" '{text: $text}' \
          | curl -fsS -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d @-
