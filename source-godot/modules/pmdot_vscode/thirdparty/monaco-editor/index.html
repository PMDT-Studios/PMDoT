<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMDoT Code IDE</title>
  <link rel="stylesheet" href="vs/editor/editor.main.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1e1e1e; color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    #ide-shell { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #ide-main { display: flex; flex: 1; min-height: 0; }
    #activity-bar {
      width: 44px; background: #333333; display: flex; flex-direction: column;
      align-items: center; padding-top: 8px; gap: 8px; border-right: 1px solid #252526;
    }
    .act-btn {
      width: 34px; height: 34px; background: transparent; border: none; color: #858585;
      cursor: pointer; border-radius: 4px; font-size: 16px; display: flex;
      align-items: center; justify-content: center;
    }
    .act-btn.active, .act-btn:hover { color: #ffffff; background: #2a2d2e; }
    #sidebar {
      width: 240px; background: #252526; border-right: 1px solid #1e1e1e;
      display: flex; flex-direction: column; min-width: 160px;
    }
    #sidebar-header {
      padding: 8px 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: #bbbbbb; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #1e1e1e;
    }
    .icon-btn {
      background: #0e639c; color: #fff; border: none; border-radius: 3px;
      padding: 2px 7px; cursor: pointer; font-size: 11px;
    }
    .icon-btn:hover { background: #1177bb; }
    #sidebar-content { flex: 1; overflow-y: auto; padding: 4px 0; }
    .tree-item {
      padding: 4px 12px; cursor: pointer; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;
    }
    .tree-item:hover { background: #2a2d2e; }
    .tree-item.active { background: #37373d; color: #ffffff; }
    .lang-badge {
      font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: 700;
      background: #3c3c3c; color: #4ec9b0;
    }
    #search-box { width: calc(100% - 16px); margin: 8px; padding: 5px 8px; background: #3c3c3c; color: #fff; border: 1px solid #555; border-radius: 2px; }
    #editor-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #tab-bar {
      height: 35px; background: #252526; display: flex; align-items: center;
      overflow-x: auto; border-bottom: 1px solid #1e1e1e;
    }
    .editor-tab {
      height: 100%; padding: 0 12px; display: flex; align-items: center; gap: 8px;
      background: #2d2d2d; color: #969696; cursor: pointer; border-right: 1px solid #1e1e1e;
      font-size: 12px;
    }
    .editor-tab.active { background: #1e1e1e; color: #ffffff; border-top: 2px solid #007acc; }
    .tab-close { font-size: 12px; opacity: 0.7; }
    .tab-close:hover { opacity: 1; color: #f48771; }
    #monaco-root { flex: 1; width: 100%; min-height: 0; }
    #status-bar {
      height: 22px; background: #007acc; color: #ffffff; font-size: 11px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    }
    #quick-open-overlay {
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
      width: 480px; background: #252526; border: 1px solid #454545;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 999; display: none;
    }
    #quick-open-input {
      width: 100%; padding: 8px 10px; background: #3c3c3c; color: #fff;
      border: none; outline: none; font-size: 13px;
    }
    #quick-open-list { max-height: 260px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="ide-shell">
    <div id="ide-main">
      <div id="activity-bar">
        <button class="act-btn active" data-view="explorer" title="Explorer (Files)">📁</button>
        <button class="act-btn" data-view="search" title="Search in Files (Ctrl+Shift+F)">🔍</button>
      </div>
      <div id="sidebar">
        <div id="sidebar-header">
          <span id="sidebar-title">EXPLORER</span>
          <button id="btn-new-file" class="icon-btn" title="New Code File">+ File</button>
        </div>
        <div id="sidebar-content"></div>
      </div>
      <div id="editor-area">
        <div id="tab-bar"></div>
        <div id="monaco-root"></div>
      </div>
    </div>
    <div id="status-bar">
      <span id="status-left">PMDoT Code IDE (Monaco)</span>
      <span id="status-right">Ln 1, Col 1 | UTF-8 | plaintext</span>
    </div>
  </div>

  <div id="quick-open-overlay">
    <input id="quick-open-input" type="text" placeholder="Go to file by name (Ctrl+P)..." />
    <div id="quick-open-list"></div>
  </div>

  <script src="vs/loader.js"></script>
  <script src="bridge.js"></script>
</body>
</html>
